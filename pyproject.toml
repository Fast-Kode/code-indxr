[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-indxr"
version = "0.2.0"
description = "100% local AST-aware hybrid RAG code indexer and MCP server powered by Ollama and LanceDB"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Samartha K V" }]
keywords = ["mcp", "rag", "ollama", "lancedb", "tree-sitter", "code-search", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "lancedb>=0.17.0",
    "pathspec>=0.12.1",
    "pyarrow>=17.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/samarthakv/code-indxr"
Repository = "https://github.com/samarthakv/code-indxr"
Issues = "https://github.com/samarthakv/code-indxr/issues"

[project.scripts]
code-indxr = "code_indxr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_indxr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
