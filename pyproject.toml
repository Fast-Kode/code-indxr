[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-indxr"
version = "0.1.0"
description = "Local AST-aware hybrid RAG code indexer and MCP server powered by Ollama and LanceDB"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "lancedb>=0.17.0",
    "pathspec>=0.12.1",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[project.scripts]
code-indxr = "code_indxr.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_indxr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
